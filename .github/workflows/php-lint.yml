name: Validar sintaxis PHP

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Revisar sintaxis de los archivos PHP
        run: find . -name "*.php" -print0 | xargs -0 -n1 php -l
